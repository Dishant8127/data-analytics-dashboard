version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dashboard-backend
    command: ["/bin/bash", "-c", "/app/wait-for-clickhouse.sh && python run.py"]
    depends_on:
      - clickhouse
      - redis
      - postgres
    environment:
      FLASK_ENV: development
      FLASK_APP: app:create_app
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    ports:
      - "5000:5000"
    restart: always
    networks:
      - dashboard-net

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dashboard-celery
    command: ["/bin/bash", "-c", "/app/wait-for-clickhouse.sh && celery -A celery_worker.celery worker --loglevel=INFO --pool=solo"]
    depends_on:
      - redis
      - clickhouse
      - postgres
    env_file:
      - ./backend/.env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    restart: always
    networks:
      - dashboard-net

  redis:
    image: redis/redis-stack-server:latest
    container_name: redis
    ports:
      - "6379:6379"
    restart: always
    networks:
      - dashboard-net

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: mypassword
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse-init:/docker-entrypoint-initdb.d
    restart: always
    networks:
      - dashboard-net

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: dashboard
      POSTGRES_DB: dashboard_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    networks:
      - dashboard-net

volumes:
  clickhouse_data:
  postgres_data:

networks:
  dashboard-net:
    driver: bridge
